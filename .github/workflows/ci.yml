name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Audit Python dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=custom_components/roommind --cov-report=term --cov-fail-under=90

      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: bun run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: bun run test

      - name: ESLint
        working-directory: frontend
        run: bun run lint

      - name: Prettier check
        working-directory: frontend
        run: bun run format:check

      - name: Build frontend
        working-directory: frontend
        run: bun --bun vite build

      - name: Package smoke test
        run: uv run --locked python scripts/build_release_package.py --output dist/roommind.zip

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check custom_components/ tests/ scripts/

      - name: mypy
        run: uv run mypy --explicit-package-bases custom_components/roommind

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate GitHub Actions
        uses: reviewdog/action-actionlint@v1.73.1
        with:
          reporter: local
          fail_level: error

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
