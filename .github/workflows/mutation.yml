name: Mutation Testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-test:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Restore mutmut cache
        uses: actions/cache@v6
        with:
          path: mutants/
          key: mutmut-${{ hashFiles('custom_components/**/*.py') }}
          restore-keys: |
            mutmut-

      - name: Run mutation testing
        run: |
          uv run --with "mutmut>=3.5" mutmut run || EXIT=$?
          if [ "${EXIT:-0}" -ge 2 ]; then
            echo "::error::mutmut failed with exit code $EXIT"
            exit "$EXIT"
          fi

      - name: Post summary
        if: always()
        run: |
          # Parse the last progress line from the run log for overall stats
          # Format: ⠴ 12408/12408  🎉 8107 🫥 26  ⏰ 1754  🤔 0  🙁 2521  🔇 0  🧙 0
          uv run --with "mutmut>=3.5" mutmut results --all > /tmp/mutmut-all.txt 2>&1 || true
          uv run --with "mutmut>=3.5" mutmut results > /tmp/mutmut-survived.txt 2>&1 || true

          TOTAL=$(wc -l < /tmp/mutmut-all.txt | tr -d ' ')
          SURVIVED=$(grep -c "survived" /tmp/mutmut-survived.txt 2>/dev/null || true)
          TIMEOUT=$(grep -c "timeout" /tmp/mutmut-all.txt 2>/dev/null || true)
          NO_TESTS=$(grep -c "no tests" /tmp/mutmut-all.txt 2>/dev/null || true)
          SURVIVED=${SURVIVED:-0}
          TIMEOUT=${TIMEOUT:-0}
          NO_TESTS=${NO_TESTS:-0}
          KILLED=$((TOTAL - SURVIVED - TIMEOUT - NO_TESTS))
          if [ "$TOTAL" -gt 0 ]; then
            KILL_RATE=$((KILLED * 100 / TOTAL))
          else
            KILL_RATE=0
          fi

          {
            echo "## Mutation Testing Results"
            echo ""
            echo "| Status | Count | % |"
            echo "|--------|------:|--:|"
            echo "| Killed | $KILLED | ${KILL_RATE}% |"
            echo "| Survived | $SURVIVED | |"
            echo "| Timeout | $TIMEOUT | |"
            echo "| No tests | $NO_TESTS | |"
            echo "| **Total** | **$TOTAL** | |"
            echo ""
            echo "### Survived by file"
            echo ""
            echo '```'
            grep "survived" /tmp/mutmut-survived.txt 2>/dev/null \
              | sed 's/:.*//' \
              | sed 's/\.x[ǁ_].*//; s/\.x__.*//; s/\.x_/\./' \
              | sort | uniq -c | sort -rn || echo "  (none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate artifact
        if: always()
        run: |
          uv run --with "mutmut>=3.5" mutmut results > mutation-report.txt 2>&1 || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation-report.txt
          retention-days: 30
