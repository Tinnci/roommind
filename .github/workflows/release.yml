name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to package and upload
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "Release workflow must run from a tag push or workflow_dispatch." >&2
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *)
              echo "Release tag must start with v: $tag" >&2
              exit 1
              ;;
          esac
          case "$tag" in
            *[[:space:]]*)
              echo "Release tag must not contain whitespace." >&2
              exit 1
              ;;
          esac
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vX.Y.Z." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"


  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
      release_tag: ${{ needs.resolve.outputs.tag }}

  build-and-upload:
    name: Publish verified release asset
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Use package built by verification
        uses: actions/download-artifact@v8.0.1
        with:
          name: roommind-package
          path: dist

      - name: Prepare release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 ~ "^## " version " " { capture=1; print; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            printf 'Release asset for RoomMind %s is attached below.\n' "$tag" > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$NOTES_FILE" --repo "$GITHUB_REPOSITORY"
            gh release upload "$tag" dist/roommind.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/roommind.zip \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "RoomMind $tag" \
              --notes-file "$NOTES_FILE"
          fi
