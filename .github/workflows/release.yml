name: Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint

      - name: Type check frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Build frontend
        working-directory: frontend
        run: bun --bun vite build

      - name: Create release zip
        run: cd custom_components/roommind && zip -r ../../roommind.zip . -x "__pycache__/*" "*/__pycache__/*" "*.pyc"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" roommind.zip --clobber
