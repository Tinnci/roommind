name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to package and upload
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag_name }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "Release workflow must run from a tag push or workflow_dispatch." >&2
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *)
              echo "Release tag must start with v: $tag" >&2
              exit 1
              ;;
          esac
          case "$tag" in
            *[[:space:]]*)
              echo "Release tag must not contain whitespace." >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Audit Python dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Run backend tests with coverage
        run: uv run pytest tests/ -v --cov=custom_components/roommind --cov-report=term --cov-fail-under=90

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check custom_components/ tests/ scripts/

      - name: mypy
        run: uv run mypy --explicit-package-bases custom_components/roommind

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint

      - name: Test frontend
        working-directory: frontend
        run: bun run test

      - name: Type check frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Prettier check frontend
        working-directory: frontend
        run: bun run format:check

      - name: Build frontend
        working-directory: frontend
        run: bun --bun vite build

      - name: Create release zip
        run: uv run --locked python scripts/build_release_package.py --output dist/roommind.zip --tag "${{ steps.release.outputs.tag }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: roommind-${{ steps.release.outputs.tag }}
          path: dist/roommind.zip
          if-no-files-found: error

      - name: Prepare release notes
        id: notes
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 ~ "^## " version " " { capture=1; print; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            printf 'Release asset for RoomMind %s is attached below.\n' "$tag" > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "${{ steps.notes.outputs.notes_file }}" --repo "$GITHUB_REPOSITORY"
            gh release upload "$tag" dist/roommind.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/roommind.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "RoomMind $tag" \
              --notes-file "${{ steps.notes.outputs.notes_file }}"
          fi
