name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to package and upload
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag_name }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "Release workflow must run from a tag push or workflow_dispatch." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint

      - name: Type check frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Build frontend
        working-directory: frontend
        run: bun --bun vite build

      - name: Create release zip
        run: uv run python scripts/build_release_package.py --output dist/roommind.zip --tag "${{ steps.release.outputs.tag }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: roommind-${{ steps.release.outputs.tag }}
          path: dist/roommind.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/roommind.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/roommind.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "RoomMind $tag" \
              --generate-notes
          fi
