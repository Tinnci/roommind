version: 2
updates:
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - frontend
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - python
    groups:
      python-runtime:
        dependency-type: production
      python-dev:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - tooling
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
