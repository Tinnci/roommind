<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMind Panel Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        --primary-color: #03a9f4;
        --primary-text-color: #202124;
        --secondary-text-color: #667085;
        --primary-background-color: #eef2f6;
        --card-background-color: #ffffff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --error-color: #d32f2f;
        --warning-color: #ff9800;
        --success-color: #2e7d32;
        --disabled-text-color: #9aa0a6;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary-text-color: #f4f7fb;
          --secondary-text-color: #a8b3c2;
          --primary-background-color: #0d1117;
          --card-background-color: #151a20;
          --divider-color: rgba(255, 255, 255, 0.12);
        }
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/dev/panel-preview.ts"></script>
  </body>
</html>
