<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMind Room Detail Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        --primary-color: #03a9f4;
        --primary-text-color: #202124;
        --secondary-text-color: #667085;
        --card-background-color: #ffffff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --error-color: #d32f2f;
        --warning-color: #ff9800;
        --success-color: #2e7d32;
        --disabled-text-color: #9aa0a6;
        --code-font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef2f6;
        color: var(--primary-text-color);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary-text-color: #f4f7fb;
          --secondary-text-color: #a8b3c2;
          --card-background-color: #151a20;
          --divider-color: rgba(255, 255, 255, 0.12);
          background: #0d1117;
        }
      }

      body {
        margin: 0;
        padding: 18px;
      }

      #app {
        width: min(100%, 1800px);
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/dev/room-detail-preview.ts"></script>
  </body>
</html>
