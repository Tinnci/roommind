repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^\.devcontainer/
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy --explicit-package-bases custom_components/roommind
        language: system
        pass_filenames: false

      - id: frontend-format
        name: frontend prettier
        entry: bash -c 'cd frontend && bun run format'
        language: system
        pass_filenames: false
        files: ^frontend/((src|scripts)/.*\.(ts|js|json)|vite\.config\.ts|package\.json|tsconfig(\.(test|tools))?\.json)$
