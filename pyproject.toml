# --------------------------------------------------------------------------- #
# Tool configuration
# --------------------------------------------------------------------------- #

[project]
name = "roommind"
version = "0.1.0"
requires-python = ">=3.13.2"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "PLC",  # pylint convention
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "PLC0415",  # import not at top level (intentional lazy imports)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.roommind"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "homeassistant.*"
follow_imports = "skip"

[tool.coverage.run]
relative_files = true

[tool.mutmut]
paths_to_mutate = ["custom_components/roommind/"]
tests_dir = ["tests/"]
do_not_mutate = [
    "**/const.py",        # constants, no logic
    "**/config_flow.py",  # HA boilerplate
    "**/__init__.py",     # setup/registration, tested via integration
]

[dependency-groups]
dev = [
    "homeassistant==2026.2.3",
    "mypy>=2.1.0",
    "pytest-cov>=7.0.0",
    "pytest-freezer>=0.4.9",
    "pytest-homeassistant-custom-component==0.13.316",
    "pytest-sugar>=1.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.14",
]
